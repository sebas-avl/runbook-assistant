name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Pytest
        run: pytest
  
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 
      
      - name: Build image
        run: docker build -t runbook-assistant:ci .

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: runbook-assistant:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_FILE_PATTERNS: "pip:requirements-dev.txt"
        with:
          scan-type: "fs"
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"